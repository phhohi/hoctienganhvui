app.innerHTML=head()+'<div class="card">'+body+'</div><div class="fb" id="fb" role="status" aria-live="polite">Chọn hoặc nhập đáp án của em.</div><div class="nav"><button class="btn alt" id="redo">Làm lại</button><button class="btn alt" id="show" hidden>Xem đáp án</button><span class="grow"></span><button class="btn" id="next" disabled>'+(qi===order.length-1?'Xem kết quả':'Tiếp theo')+'</button></div>';
$('#snd').onclick=function(){sound=!sound;$('#snd').textContent=sound?'Âm':'Tắt'};
$('#redo').onclick=function(){play2(true)};$('#next').onclick=function(){qi++;play()};$('#show').onclick=reveal;
mount(q)}
function play2(){var q=order[qi];tries=0;solved=false;S={};$('#fb').className='fb';$('#fb').textContent='Chọn hoặc nhập đáp án của em.';$('#next').disabled=true;$('#show').hidden=true;mount(q)}
function mount(q){var a=$('#area');
if(q.t==='c')mode==='mc'?mkChoice(a,q):mkTyped(a,q);
else if(q.t==='o')mkOrder(a,q);else if(q.t==='m')mkMatch(a,q);else mkSort(a,q)}
function answerText(q){if(q.t==='c')return q.o[0];if(q.t==='o')return q.s;if(q.t==='m')return q.pairs.map(function(p){return p[0]+' = '+p[1]}).join(' · ');return q.items.map(function(i){return i[0]+' → '+q.cats[i[1]]}).join(' · ')}
function good(q){solved=true;if(tries===0){score++;$('#sc').textContent='Điểm: '+score}sfx(true);
var f=$('#fb');f.className='fb ok';f.innerHTML='<b>Chính xác!</b>'+(q.e?esc(q.e):'');$('#next').disabled=false;$('#show').hidden=true;$('#next').focus&&0}
function wrong(q,hint){tries++;sfx(false);var f=$('#fb');f.className='fb bad';f.innerHTML='<b>Chưa chính xác. Thử lại nhé!</b>'+(hint?esc(hint):'');if(tries>=3)$('#show').hidden=false}
function reveal(){var q=order[qi];solved=true;var f=$('#fb');f.className='fb';f.innerHTML='<b>Đáp án</b>'+esc(answerText(q))+(q.e?' · '+esc(q.e):'');$('#next').disabled=false;$('#show').hidden=true;
document.querySelectorAll('#area button,#area input').forEach(function(b){b.disabled=true})}
function mkChoice(a,q){var os=shuf(q.o);a.innerHTML='<div class="opts">'+os.map(function(o,i){return'<button class="opt" data-i="'+i+'">'+esc(o)+'</button>'}).join('')+'</div>';
a.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){if(solved)return;var o=os[+b.dataset.i];if(o===q.o[0]){b.classList.add('ok');good(q)}else{b.classList.add('bad');wrong(q,'Gợi ý: '+(q.h||'đọc lại câu hỏi thật kĩ.'));setTimeout(function(){b.classList.remove('bad')},500)}}})}
function mkTyped(a,q){a.innerHTML='<div class="typed"><input id="ans" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Đáp án" placeholder="Gõ đáp án..."><button class="btn" id="chk">Kiểm tra</button></div>';
var inp=$('#ans');function chk(){if(solved)return;var v=inp.value;if(!norm(v))return;if(norm(v)===norm(q.o[0])){inp.disabled=true;good(q)}else{var c=q.o[0];wrong(q,'Gợi ý: đáp án bắt đầu bằng "'+c.charAt(0)+'" và có '+c.split(' ').length+' từ.')}}
$('#chk').onclick=chk;inp.onkeydown=function(e){if(e.key==='Enter')chk()};inp.focus()}
function mkOrder(a,q){S.bank=shuf(q.w.map(function(w,i){return{w:w,id:i}}));S.put=[];
function draw(){a.innerHTML='<div class="slot" id="slot" aria-label="Câu của em">'+S.put.map(function(t){return'<button class="chip" data-id="'+t.id+'" data-s="1">'+esc(t.w)+'</button>'}).join('')+'</div><div class="bank">'+S.bank.map(function(t){return'<button class="chip" data-id="'+t.id+'">'+esc(t.w)+'</button>'}).join('')+'</div><button class="btn" id="chk">Kiểm tra</button>';
a.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){if(solved)return;var id=+b.dataset.id;if(b.dataset.s){var t=S.put.find(function(x){return x.id===id});S.put=S.put.filter(function(x){return x.id!==id});S.bank.push(t)}else{var t2=S.bank.find(function(x){return x.id===id});S.bank=S.bank.filter(function(x){return x.id!==id});S.put.push(t2)}draw()}});
$('#chk').onclick=function(){if(solved||!S.put.length)return;var s=S.put.map(function(t){return t.w}).join(' ');if(norm(s)===norm(q.s)){$('#slot').querySelectorAll('.chip').forEach(function(c){c.classList.add('ok')});good(q)}else{wrong(q,'Gợi ý: câu bắt đầu bằng "'+q.w[0]+'".')}}}
draw()}
function mkMatch(a,q){var L=q.pairs.map(function(p,i){return{t:p[0],i:i}}),R=shuf(q.pairs.map(function(p,i){return{t:p[1],i:i}}));S.sel=null;S.done=0;S.mis=0;
a.innerHTML='<div class="cols"><div class="col" id="cl"></div><div class="col" id="cr"></div></div>';
L.forEach(function(x){var b=document.createElement('button');b.className='mt';b.textContent=x.t;b.dataset.i=x.i;b.dataset.side='l';$('#cl').appendChild(b)});
R.forEach(function(x){var b=document.createElement('button');b.className='mt';b.textContent=x.t;b.dataset.i=x.i;b.dataset.side='r';$('#cr').appendChild(b)});
a.querySelectorAll('.mt').forEach(function(b){b.onclick=function(){if(solved||b.classList.contains('ok'))return;
if(b.dataset.side==='l'){a.querySelectorAll('.mt[data-side=l]').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');S.sel=b;return}
if(!S.sel){var f=$('#fb');f.className='fb';f.textContent='Chọn một ô bên trái trước.';return}
if(S.sel.dataset.i===b.dataset.i){S.sel.classList.remove('sel');S.sel.classList.add('ok');b.classList.add('ok');S.sel=null;S.done++;if(S.done===q.pairs.length)good(q);else{var f2=$('#fb');f2.className='fb ok';f2.innerHTML='<b>Đúng một cặp!</b>Ghép tiếp nhé.'}}
else{b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},500);wrong(q,'Cặp này chưa khớp.');}}})}
function mkSort(a,q){S.items=shuf(q.items.map(function(x,i){return{w:x[0],c:x[1],id:i}}));S.sel=null;S.in=q.cats.map(function(){return[]});
function draw(){a.innerHTML='<div class="bank">'+S.items.map(function(t){return'<button class="chip'+(S.sel===t.id?' sel':'')+'" data-id="'+t.id+'">'+esc(t.w)+'</button>'}).join('')+'</div><div class="cats">'+q.cats.map(function(c,i){return'<button class="cat" data-c="'+i+'"><h3>'+esc(c)+'</h3>'+S.in[i].map(function(t){return'<span class="chip ok">'+esc(t.w)+'</span>'}).join('')+'</button>'}).join('')+'</div>';
a.querySelectorAll('.bank .chip').forEach(function(b){b.onclick=function(){if(solved)return;S.sel=+b.dataset.id;draw()}});
a.querySelectorAll('.cat').forEach(function(b){b.onclick=function(){if(solved)return;if(S.sel===null){var f=$('#fb');f.className='fb';f.textContent='Chọn một từ trước, rồi chọn nhóm.';return}
var t=S.items.find(function(x){return x.id===S.sel}),c=+b.dataset.c;
if(t.c===c){S.items=S.items.filter(function(x){return x.id!==t.id});S.in[c].push(t);S.sel=null;draw();if(!S.items.length)good(q);else{var f2=$('#fb');f2.className='fb ok';f2.innerHTML='<b>Đúng rồi!</b>Phân loại tiếp nhé.'}}
else{wrong(q,'"'+t.w+'" không thuộc nhóm này.');S.sel=null;draw()}}})}
draw()}
function end(){var pct=score/order.length,st=pct>=.9?'3 sao':pct>=.6?'2 sao':'1 sao';
var star=pct>=.9?'★★★':pct>=.6?'★★☆':'★☆☆';
app.innerHTML=head()+'<div class="card center"><p class="kicker">Hoàn thành</p><div class="big">'+score+' / '+order.length+'</div><div class="stars" aria-label="'+st+'">'+star+'</div><p class="prompt">'+(pct>=.9?'Giỏi lắm! Em nắm bài rất chắc.':pct>=.6?'Khá tốt! Chơi lại để đạt điểm cao hơn nhé.':'Cố gắng lên! Chơi lại để luyện thêm nhé.')+'</p><div class="nav"><button class="btn" id="again">Chơi lại</button><button class="btn alt" id="home">Đổi chế độ</button></div></div>';
$('#again').onclick=function(){order=shuf(U.qs);qi=0;score=0;play()};$('#home').onclick=start;$('#snd').onclick=function(){sound=!sound;$('#snd').textContent=sound?'Âm':'Tắt'};sfx(true)}
start();
})();
</script>
